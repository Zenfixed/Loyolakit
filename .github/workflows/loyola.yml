name: Build Plugin

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Auto-Find and Build with Maven
      run: |
        POM_DIR=$(find . -name "pom.xml" -exec dirname {} \; | head -n 1)
        echo "Found project in: $POM_DIR"
        cd "$POM_DIR"
        mvn -B clean package

    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LoyolaKit-JAR
        path: '**/target/*.jar'
